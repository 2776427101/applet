# ⚠️ 这是**当前生效**的配置，docker-compose.yml 挂载的就是这个文件。
#
# 初始内容 = nginx.http.conf（阶段一，只有 HTTP）。
# 拿到证书后执行：cp nginx.https.conf nginx.conf && docker compose restart nginx
# 想回退到 HTTP：  cp nginx.http.conf  nginx.conf && docker compose restart nginx
#
# 下面这一行必须改成你自己的域名，否则 Nginx 不认这个请求。

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;          # ← 改成你的域名

    # 日志分开存，排查时不用翻整个 access.log
    access_log /var/log/nginx/class-assistant.access.log;
    error_log  /var/log/nginx/class-assistant.error.log warn;

    # Let's Encrypt 申请/续期证书时，要能访问这个隐藏路径。
    # 放在 /api/ 前面，避免被反代规则吃掉。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ------------------------------------------------------------ 业务接口
    location /api/ {
        # 末尾不加斜杠 = 原样转发完整路径（/api/xxx 还是 /api/xxx）。
        # 因为后端的 @RequestMapping 里本来就带 /api 前缀，加了斜杠会变成双斜杠。
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 学生名单导入是 multipart 上传，后端限制单文件 5MB、整个请求 6MB。
        # Nginx 默认只允许 1MB —— 不放开的话请求会先被 Nginx 挡成 413，
        # 后端那句「文件不能超过 5MB」的友好提示根本到不了前端。
        client_max_body_size 8m;
        client_body_timeout  60s;

        # 批量成绩录入、导入预览可能超过默认 60 秒
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 不让浏览器缓存接口响应（否则改了数据前端还看到旧的）
        proxy_buffering off;
    }

    # ------------------------------------------------------------ 健康检查
    # 运维用：curl http://你的域名/ping 应该返回 pong。
    # 不暴露任何业务信息，可以留着。
    location = /ping {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "pong\n";
    }

    # 其它路径一律拒绝。访问根路径能看到 Spring Boot 报错页没有任何好处，
    # 反而暴露了技术栈和版本号。
    location / {
        return 404;
    }
}
