# 班级助手 · Nginx 反向代理（阶段二：HTTPS 正式版）
#
# 用法：证书申请成功后，用它覆盖 nginx.conf：
#     cp nginx.https.conf nginx.conf
#     docker compose restart nginx
#
# 注意：文件里 4 处 api.example.com 都要改成你的真实域名（server_name 两处 + 证书路径两处）。

# ---------------------------------------------------------------- HTTP 入口
# 只做两件事：放行证书校验路径，其余全部跳 HTTPS。
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;          # ← 改成你的域名

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- HTTPS 入口
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;          # ← 改成你的域名

    # certbot 会在这两个路径生成 fullchain.pem / privkey.pem。
    # 必须是 fullchain（含中间证书），只用 cert.pem 的话
    # 微信小程序会报「证书链不完整」而拒绝请求。
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;   # ← 改域名
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;     # ← 改域名

    # 微信小程序要求 TLS 1.2 及以上
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 强制后续访问走 HTTPS。开之前先确认 HTTPS 已经能正常打开，
    # 否则一旦出问题，浏览器连回退到 HTTP 的机会都没有（要等 max-age 过期）。
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/class-assistant.access.log;
    error_log  /var/log/nginx/class-assistant.error.log warn;

    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        client_max_body_size 8m;
        client_body_timeout  60s;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }

    location = /ping {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "pong\n";
    }

    location / {
        return 404;
    }
}
