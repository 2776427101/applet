server:
  port: 8080 # Tomcat启动端口

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/class_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai # 数据库连接URL
    username: ${DB_USER:root} # 数据库用户名
    password: ${DB_PASSWORD:} # 数据库密码
  # 学生名单导入要传 xlsx。默认上限只有 1MB，69 人的名单大概 20~40KB，
  # 但带图片的表格很容易超，这里放到 5MB（和 StudentImportServiceImpl 里的常量一致）
  servlet:
    multipart:
      max-file-size: 5MB      # 单个文件
      max-request-size: 6MB   # 整个请求（文件 + 表单字段）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true                        # create_at → createAt下划线到驼峰的映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl     # 控制台打印 SQL，调试必备，日志实现

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-32-chars-min} # 启动时生成的 JWT 密钥如果没有则使用默认值dev-only-change-me-please-32-chars-min
    expire-seconds: 604800          # 7 天，JWT 过期时间
  wx:
    appid: ${WX_APPID:} # 微信小程序的 appid
    secret: ${WX_SECRET:} # 微信小程序的 secret
    mock: ${WX_MOCK:true} # 开发默认 true；正式环境必须设 WX_MOCK=false，否则所有人都会登录成同一个测试账号
    mock-openid: seed_openid_teacher # mock 模式下的固定 openid，对应 02_seed.sql 里的李光老师（id=1，带 628 班）
